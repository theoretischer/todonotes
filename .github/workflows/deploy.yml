name: Deploy

# Automatisches Deploy bei Push auf main.
# - Web-App (Wasm): neu bauen + per rsync auf den Server (nur wenn
#   compose-app/ geändert wurde)
# - Backend: git pull + docker compose up --build auf dem Server (nur wenn
#   backend/ geändert wurde)
#
# Benötigte GitHub-Secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST        z.B. mein-server.de (oder IP)
#   SSH_USER        z.B. deploy
#   SSH_PRIVATE_KEY privater SSH-Key, dessen PUBLIC-Key in ~/.ssh/authorized_keys
#                   auf dem Server liegt
#   SERVER_REPO_PATH  Pfad zum ausgecheckten Repo auf dem Server,
#                     z.B. /opt/todonotes/repo

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'compose-app/**'
            backend:
              - 'backend/**'

  # --- Web-App: Wasm-Build + rsync ---
  deploy-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Wasm-App
        working-directory: compose-app
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Install SSH key
        run: |
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync web-dist to server
        run: |
          rsync -az --delete \
            compose-app/composeApp/build/dist/wasmJs/productionExecutable/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/todonotes/web/"

      - name: Ensure web dir is readable by container
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "chmod -R a+rX /opt/todonotes/web"

  # --- Backend: git pull + Container-Rebuild auf dem Server ---
  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install SSH key
        run: |
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull & rebuild backend on server
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ secrets.SERVER_REPO_PATH }}/backend && git pull && docker compose up -d --build"
