<?xml version="1.0" encoding="UTF-8"?>
<!--
  Neues App-Icon — passt zur M14-UI:Theme-Blau #2F5FC4,
  Hintergrund wie die dunkle App (#1C1D21), Karten-Weiß.
  Design: Checkliste (2 von 3 erledigt) = Todos + Gewohnheiten,
  Notiz-Zeile mit Stift-Strich = Notizen.

  NUR ZUM ANSEHEN — noch NICHT eingesetzt (favicon.svg und
  ic_launcher sind unverändert). Nutzer schaut es sich an,
  dann: Android-Icon (adaptive: Hintergrund #1C1D21, Vordergrund
  zentriert mit ~66% Größe) + Website-favicon ableiten.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- dunkler Hintergrund wie die App (#1C1D21) -->
  <rect width="108" height="108" rx="24" fill="#1C1D21"/>

  <!-- Karte: etwas heller als Hintergrund (#2A2C32 wie die Karten) -->
  <rect x="18" y="18" width="72" height="72" rx="20" fill="#2A2C32"/>

  <!-- Checkliste: 2 angehakte + 1 offene Zeile -->
  <!-- Zeile 1: angehakt (Theme-Blau) -->
  <path d="M 32 38 l 4.5 4.5 l 9 -10" fill="none" stroke="#8AB4FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="52" y="34" width="24" height="5" rx="2.5" fill="#FFFFFF" opacity="0.92"/>

  <!-- Zeile 2: angehakt (Theme-Blau) -->
  <path d="M 32 58 l 4.5 4.5 l 9 -10" fill="none" stroke="#8AB4FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="52" y="54" width="18" height="5" rx="2.5" fill="#FFFFFF" opacity="0.92"/>

  <!-- Zeile 3: offen (Grau) -->
  <circle cx="36" cy="76" r="4" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"/>
  <rect x="52" y="72.5" width="24" height="5" rx="2.5" fill="#FFFFFF" opacity="0.35"/>
</svg>