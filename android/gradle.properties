# JVM-Args für Gradle
# -XX:UseAVX=2: deaktiviert AVX-512 (Java4Shell CVE-2026-114938 Fix,
#   17.0.21 ist vor dem Patch vom 17.11.2026). Behält AVX2 → kein
#   Performance-Verlust für Build-Workloads.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:UseAVX=2
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin Code Style
kotlin.code.style=official
