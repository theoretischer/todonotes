services:
  todonotes-backend:
    build: .
    container_name: todonotes-backend
    restart: unless-stopped
    ports:
      # Lokaler Dev: 0.0.0.0 → vom Handy im WLAN erreichbar (http://<server-ip>:8000).
      # Produktiv: auf 127.0.0.1 lassen + Reverse-Proxy davor.
      - "0.0.0.0:8000:8000"
    volumes:
      # SQLite-Datei persistent im Named-Volume (überlebt Rebuilds).
      - todonotes-data:/app/data
    environment:
      # Token aus .env. Nie in Git committen!
      # Static-Secret für Übergangs-Compat (alte Android-App).
      # Kann leer gesetzt werden, wenn alle Clients auf account-basierte Auth umgestellt sind.
      SYNC_TOKEN: ${SYNC_TOKEN:-}
      DB_PATH: /app/data/todonotes.db
      DATA_DIR: /app/data
      # Web-App (Wasm-dist, per deploy-web.sh ins Repo kopiert & committet)
      WEB_DIR: /app/web

volumes:
  todonotes-data:
