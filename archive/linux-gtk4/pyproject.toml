[project]
name = "todonotes"
version = "0.1.0"
description = "TodoNotes Linux-Client (GTK4 + libadwaita)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "python-dateutil>=2.8",
    "PyGObject>=3.42",
]

[project.scripts]
todonotes = "todonotes.app:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["todonotes", "todonotes.ui"]
